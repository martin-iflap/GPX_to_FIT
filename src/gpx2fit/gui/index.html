<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPX to FIT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <section id="mapPanel">
        <div id="map"></div>
        <div id="mapEmptyState" class="map-empty-state">
          <p>Upload a GPX file to preview the route</p>
        </div>
      </section>

      <aside id="sidebar">
        <header class="sidebar-header">
          <div>
            <h1>GPX → FIT</h1>
            <p class="subtle">Adaptive pacing with anchor-based timing</p>
          </div>
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">🌙</button>
        </header>

        <div class="sidebar-body">
          <section class="control">
            <label class="control-label" for="gpxFileInput">GPX file</label>
            <div id="dropzone" class="dropzone" tabindex="0">
              <input id="gpxFileInput" type="file" accept=".gpx" class="visually-hidden" />
              <div class="dropzone-content">
                <span class="dropzone-icon">⤒</span>
                <p class="dropzone-text">Drag &amp; drop a GPX file, or <span class="dropzone-link">browse</span></p>
                <p id="fileName" class="dropzone-filename" hidden></p>
              </div>
            </div>
            <div id="routeSummary" class="route-summary" hidden>
              <div class="summary-stat">
                <span class="summary-value" id="summaryDistance">—</span>
                <span class="summary-label">Distance</span>
              </div>
              <div class="summary-stat">
                <span class="summary-value" id="summaryElevation">—</span>
                <span class="summary-label">Elevation gain</span>
              </div>
            </div>
          </section>

          <section class="control">
            <span class="control-label">Sport</span>
            <div id="sportControl" class="segmented" role="tablist">
              <button type="button" class="segmented-option is-active" data-value="hiking" role="tab" aria-selected="true">Hiking</button>
              <button type="button" class="segmented-option" data-value="running" role="tab" aria-selected="false">Running</button>
            </div>
          </section>

          <section class="control">
            <span class="control-label">Start time</span>
            <div id="startTimeField"></div>
            <div id="startTimeToggle" class="time-toggle"></div>
          </section>

          <section class="control">
            <div class="control-label-row">
              <span class="control-label">Anchor points</span>
            </div>
            <ul id="anchorList" class="anchor-list"></ul>
            <p id="anchorEmptyState" class="anchor-empty">No anchor points yet — click anywhere on the route to add one.</p>
          </section>

          <button id="runButton" class="primary-button" type="button" disabled>Convert to FIT</button>
          <div id="status" class="status" role="status">Ready.</div>
          <a id="downloadLink" class="download-link" hidden download="activity.fit">Download FIT</a>
        </div>
      </aside>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.3/full/pyodide.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
