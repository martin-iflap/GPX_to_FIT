[project]
name = "gpx-to-fit"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fit-tool>=0.9.16",
    "gpxpy>=1.6.2",
    "pyrefly>=0.60.0",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gpx2fit"]

[tool.pyrefly]
search-path = ["src", "."]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
