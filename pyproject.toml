[project]
name = "gpx-to-fit"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fit-tool>=0.9.16",
    "gpxpy>=1.6.2",
    "pyrefly>=0.60.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gpx2fit/core", "src/gpx2fit/pacing"]

[tool.hatch.build.targets.wheel.sources]
"src/gpx2fit/core" = "core"
"src/gpx2fit/pacing" = "pacing"

[tool.uv]
package = true
